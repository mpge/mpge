<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect x="4" y="4" width="40" height="40" rx="8" fill="rgba(255,255,255,0.1)" />
  <!-- Double chevron icon -->
  <g transform="translate(24,24) scale(1.35) translate(-12,-12)">
    <polyline points="17 11 12 6 7 11" fill="none" stroke="url(#rainbow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="17 18 12 13 7 18" fill="none" stroke="url(#rainbow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wordmark -->
  <text x="52" y="31" font-family="Space Grotesk, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="-0.02em">Escalated</text>
</svg>
